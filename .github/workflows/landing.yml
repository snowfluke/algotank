# Publishes the landing page (apps/web/landing) to GitHub Pages. It runs when a push to
# main changes anything the page is built from: its own folder, the game's drawings,
# copy and tokens it reuses (apps/web/src), the engine that records the demo rounds, or
# the bot lineup. The game's address that the buttons link to is GAME_URL in
# apps/web/landing/build.tsx.

name: Landing page

on:
  push:
    branches: [main]
    paths:
      - "apps/web/landing/**"
      - "apps/web/src/**"
      - "apps/web/public/favicon.svg"
      - "packages/**"
      - "apps/server/src/bots.ts"
      - "docs/assets/screenshot-tournament-result.png"
      - "bun.lock"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push waits instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # The Bun version the project is developed and tested with.
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test apps/web/landing
      - run: bun run build:landing
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/landing/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
