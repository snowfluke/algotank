# Publishes the landing page (apps/web/landing) to Cloudflare Pages, project
# "algotank-landing", served at https://tank.awala.my.id (the repository is private, so
# GitHub Pages no longer serves it). It runs when a push to main changes anything the page
# is built from: its own folder, the game's drawings, copy and tokens it reuses
# (apps/web/src), the engine that records the demo rounds, or the server's bot lineup and
# turn length. The build itself fails when the demo rounds stop showing that the rule
# order matters, so it needs no separate test step. The game's address that the buttons
# link to is GAME_URL in apps/web/landing/build.tsx.
#
# Repository secrets: CLOUDFLARE_API_TOKEN (an API token with "Cloudflare Pages: Edit")
# and CLOUDFLARE_ACCOUNT_ID.

name: Landing page

on:
  push:
    branches: [main]
    paths:
      - "apps/web/landing/**"
      - "apps/web/src/**"
      - "apps/web/public/favicon.svg"
      - "packages/**"
      - "apps/server/src/bots.ts"
      - "apps/server/src/public-kinds.ts"
      - "docs/assets/screenshot-tournament-result.png"
      - "bun.lock"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits instead of cancelling a deploy in progress.
concurrency:
  group: landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # The Bun version the project is developed and tested with.
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build:landing
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/landing/dist --project-name=algotank-landing --branch=main
