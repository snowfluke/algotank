# The checks every change must pass (CONTRIBUTING.md). The no-scroll audit needs a browser and a
# running server, so it stays a local check.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # The Bun version the project is developed and tested with.
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun test
      - run: bun run build
